name: Sync game data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # Check changes to the sync itself without publishing anything.
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-data.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-data

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the sync script
        run: node --test scripts/sync-data.test.mjs

      - name: Dry run
        if: github.event_name == 'pull_request'
        run: node scripts/sync-data.mjs --dry-run

      - name: Build and check data
        id: sync
        if: github.event_name != 'pull_request'
        run: node scripts/sync-data.mjs --report "$RUNNER_TEMP/sync-report.md"

      - name: Publish
        if: steps.sync.outputs.status == 'publish' || steps.sync.outputs.status == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.sync.outputs.status }}
        run: bash scripts/publish-sync.sh "$STATUS" "$RUNNER_TEMP/sync-report.md"

      - name: Report failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Data sync is failing'
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The live site still has the last good data. Details: $RUN_URL"
          fi
